name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-quickpulse:
    name: Deploy QuickPulse to Hostinger Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/deploy-quickpulse-vps'

    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '200.141.0.224' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      QUICKPULSE_ADMIN_PASSWORD: ${{ secrets.QUICKPULSE_ADMIN_PASSWORD }}
      QUICKPULSE_JWT_SECRET: ${{ secrets.QUICKPULSE_JWT_SECRET }}

    steps:
      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Inspect, deploy, and verify standalone QuickPulse
        run: |
          test -n "$VPS_PASSWORD"
          test -n "$QUICKPULSE_ADMIN_PASSWORD"
          test -n "$QUICKPULSE_JWT_SECRET"

          sshpass -p "$VPS_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$VPS_USER@$VPS_HOST" \
            "QUICKPULSE_ADMIN_PASSWORD='$QUICKPULSE_ADMIN_PASSWORD' QUICKPULSE_JWT_SECRET='$QUICKPULSE_JWT_SECRET' bash -se" <<'REMOTE'
          set -euo pipefail

          echo "Connected to $(hostname)"
          echo "Host capacity before deployment:"
          free -h
          df -h /
          docker --version
          docker compose version
          k3s --version | head -1

          echo "QuickHunt health before deployment:"
          kubectl get --raw=/readyz
          kubectl -n job-hunter get pods -o wide
          before_unhealthy="$(kubectl -n job-hunter get pods --no-headers | awk '$3 != "Running" && $3 != "Completed" {count++} END {print count+0}')"

          project_dir=""
          for candidate in /root/quickpulse /root/quick-pulse /opt/quickpulse /opt/quick-pulse; do
            if [[ -d "$candidate/.git" ]]; then
              project_dir="$candidate"
              break
            fi
          done
          if [[ -z "$project_dir" ]]; then
            project_dir="$(find /root /opt -maxdepth 4 -type d -name .git -print 2>/dev/null | while read -r git_dir; do
              repo_dir="${git_dir%/.git}"
              if git -C "$repo_dir" remote get-url origin 2>/dev/null | grep -q 'quick-pulse'; then
                printf '%s\n' "$repo_dir"
                break
              fi
            done)"
          fi
          if [[ -z "$project_dir" ]]; then
            project_dir=/root/quickpulse
            git clone --branch main https://github.com/quickproduct/quick-pulse.git "$project_dir"
          fi

          echo "Using QuickPulse checkout: $project_dir"
          cd "$project_dir"
          git status --short
          if [[ -n "$(git status --porcelain=v1 --untracked-files=no)" ]]; then
            echo "Tracked QuickPulse files are modified; refusing to overwrite them."
            exit 1
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "QuickPulse revision: $(git rev-parse --short HEAD)"

          if ss -ltn '( sport = :8082 )' | tail -n +2 | grep -q .; then
            if ! docker ps --format '{{.Names}}' | grep -qx 'qp-app'; then
              echo "Port 8082 is already occupied by a service other than qp-app."
              ss -ltnp '( sport = :8082 )'
              exit 1
            fi
          fi

          install -d -m 700 /root/.kube
          if [[ ! -f /root/.kube/config ]]; then
            install -m 600 /etc/rancher/k3s/k3s.yaml /root/.kube/config
          fi

          if [[ ! -f .env ]]; then
            cp .env.example .env
          fi
          chmod 600 .env
          upsert_env() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          }
          upsert_env ENVIRONMENT production
          upsert_env DEBUG false
          upsert_env LOG_LEVEL INFO
          upsert_env JWT_SECRET_KEY "$QUICKPULSE_JWT_SECRET"
          upsert_env DEFAULT_ADMIN_EMAIL admin@quickpulse.local
          upsert_env DEFAULT_ADMIN_PASSWORD "$QUICKPULSE_ADMIN_PASSWORD"
          upsert_env ALLOW_REGISTRATION false
          upsert_env EXTERNAL_FRONTEND_PORT 127.0.0.1:8082
          upsert_env KUBECONFIG /root/.kube/config

          docker compose config --quiet
          docker compose up -d --build quickpulse

          consecutive_healthy=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8082/health >/dev/null; then
              consecutive_healthy=$((consecutive_healthy + 1))
              if [[ "$consecutive_healthy" -ge 3 ]]; then
                break
              fi
            else
              consecutive_healthy=0
            fi
            if [[ "$attempt" -eq 40 ]]; then
              docker compose ps
              docker inspect qp-app --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} error={{.State.Error}}'
              docker compose logs --tail=200 quickpulse
              exit 1
            fi
            sleep 3
          done

          health="$(curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 2 http://127.0.0.1:8082/health)"
          test "$health" = '{"status":"ok"}'

          login_payload="$(python3 -c 'import json,os; print(json.dumps({"email":"admin@quickpulse.local","password":os.environ["QUICKPULSE_ADMIN_PASSWORD"]}))')"
          login_response="$(curl --silent --fail -H 'Content-Type: application/json' -d "$login_payload" http://127.0.0.1:8082/api/v1/auth/login)"
          access_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          test -n "$access_token"

          docker_code="$(curl --silent --output /tmp/qp-docker-info.json --write-out '%{http_code}' -H "Authorization: Bearer $access_token" http://127.0.0.1:8082/api/v1/docker/info)"
          k8s_code="$(curl --silent --output /tmp/qp-k8s-overview.json --write-out '%{http_code}' -H "Authorization: Bearer $access_token" http://127.0.0.1:8082/api/v1/kubernetes/overview)"
          test "$docker_code" = 200
          test "$k8s_code" = 200

          python3 - <<'PY'
          import json
          with open('/tmp/qp-docker-info.json', encoding='utf-8') as handle:
              docker = json.load(handle)
          with open('/tmp/qp-k8s-overview.json', encoding='utf-8') as handle:
              k8s = json.load(handle)
          print('QuickPulse Docker API: connected')
          print(f"QuickPulse K3s API: source={k8s.get('source')} nodes={k8s.get('nodes')} pods={k8s.get('pods_total')}")
          PY

          docker compose ps
          docker inspect qp-app --format 'QuickPulse restart={{.HostConfig.RestartPolicy.Name}} memory={{.HostConfig.Memory}} nano_cpus={{.HostConfig.NanoCpus}}'
          docker inspect qp-app --format '{{range .Mounts}}mount={{.Destination}} type={{.Type}} rw={{.RW}}{{println}}{{end}}'

          echo "QuickHunt health after deployment:"
          kubectl get --raw=/readyz
          kubectl -n job-hunter get pods -o wide
          after_unhealthy="$(kubectl -n job-hunter get pods --no-headers | awk '$3 != "Running" && $3 != "Completed" {count++} END {print count+0}')"
          test "$after_unhealthy" -le "$before_unhealthy"

          echo "QuickPulse deployment verified successfully on 127.0.0.1:8082"
          REMOTE

  syntax-check:
    name: Step 1 - Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject committed backups and public admin secrets
        run: |
          if git ls-files 'infra/backups/*.sql' | grep -q .; then
            echo "Database backups must never be committed."
            exit 1
          fi
          if git grep -n 'NEXT_PUBLIC_ADMIN_API_KEY[[:space:]]*=' -- ':!docs/**'; then
            echo "Admin API keys must never be exposed through NEXT_PUBLIC variables."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check shell scripts
        run: |
          find . \
            -path './.git' -prune -o \
            -path './frontend/dashboard/node_modules' -prune -o \
            -path './infra/backups' -prune -o \
            -type f \( -name '*.sh' -o -perm -111 \) -print0 |
          while IFS= read -r -d '' file; do
            if head -1 "$file" | grep -qE '^#!.*(bash|sh)'; then
              bash -n "$file"
            fi
          done

      - name: Check Python syntax
        run: |
          python -m compileall -q backend mcp

      - name: Check YAML syntax
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in [*Path(".github").rglob("*.yml"), *Path(".github").rglob("*.yaml"), *Path("k8s").rglob("*.yml"), *Path("k8s").rglob("*.yaml")]:
              with path.open("r", encoding="utf-8") as handle:
                  list(yaml.safe_load_all(handle))
              print(f"ok {path}")
          PY

      - name: Check Docker Compose syntax
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml config >/dev/null
          if [[ -f infra/.env.prod ]]; then
            docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod config >/dev/null
          else
            echo "Skipping prod compose syntax check because infra/.env.prod is not committed."
          fi

  backend-test:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-shared.txt
            backend/services/api/requirements.txt
            backend/services/scraper/requirements.txt
            backend/tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install \
            -r backend/requirements-shared.txt \
            -r backend/services/api/requirements.txt \
            -r backend/services/scraper/requirements.txt \
            -r backend/tests/requirements.txt \
            pip-audit

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Audit Python dependencies
        run: python -m pip_audit --local

  dashboard-test:
    name: Dashboard lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: frontend/dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: frontend/dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: frontend/dashboard
        run: npm run build

  mobile-test:
    name: Mobile compatibility and types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate Expo dependency compatibility
        working-directory: mobile
        run: npx --yes expo-doctor

      - name: Type-check mobile app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Reject high or critical production advisories
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high

  render-test:
    name: Render service tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/render/go.mod
          cache-dependency-path: services/render/go.sum

      - name: Test render service
        working-directory: services/render
        run: go test ./...

  deploy:
    name: Steps 2-4 - Deploy to Hostinger K3s
    runs-on: ubuntu-latest
    needs: [syntax-check, backend-test, dashboard-test, mobile-test, render-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '200.141.0.224' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      ROTATED_ADMIN_API_KEY: ${{ secrets.QUICKHUNT_ADMIN_API_KEY }}
      ROTATED_INITIAL_ADMIN_PASSWORD: ${{ secrets.QUICKHUNT_INITIAL_ADMIN_PASSWORD }}
      VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR || '/root/quick-hunt' }}
      REPO_URL: https://github.com/quickproduct/quick-hunt.git
      BRANCH: main

    steps:
      - name: Validate VPS credentials
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PASSWORD"
          test -n "$ROTATED_ADMIN_API_KEY"
          test -n "$ROTATED_INITIAL_ADMIN_PASSWORD"
          test -n "$VPS_PROJECT_DIR"

      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Step 2 - SSH, Step 3 - Git pull, Step 4 - K3s pod rebuild
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$VPS_USER@$VPS_HOST" \
            "PROJECT_DIR='$VPS_PROJECT_DIR' REPO_URL='$REPO_URL' BRANCH='$BRANCH' ROTATED_ADMIN_API_KEY='$ROTATED_ADMIN_API_KEY' ROTATED_INITIAL_ADMIN_PASSWORD='$ROTATED_INITIAL_ADMIN_PASSWORD' bash -se" <<'REMOTE'
          set -euo pipefail

          echo "Step 2 - Connected to $(hostname)"

          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y git
          fi

          if [[ ! -d "$PROJECT_DIR/.git" ]]; then
            echo "Repository missing at $PROJECT_DIR; cloning first deployment copy..."
            mkdir -p "$(dirname "$PROJECT_DIR")"
            git clone --branch "$BRANCH" "$REPO_URL" "$PROJECT_DIR"
          fi

          cd "$PROJECT_DIR"

          # Older deployments kept a mutable database dump inside the Git
          # checkout. Preserve any server-local version before the incoming
          # commit removes tracked backups, then restore only the tracked path
          # so the fast-forward cannot destroy live backup data.
          backup_archive_dir="$(dirname "$PROJECT_DIR")/quick-hunt-private-backups"
          mkdir -p "$backup_archive_dir"
          chmod 700 "$backup_archive_dir"
          while IFS= read -r -d '' entry; do
            backup_path="${entry:3}"
            if [[ -f "$backup_path" ]]; then
              archive_path="$backup_archive_dir/$(basename "$backup_path").$(date -u '+%Y%m%dT%H%M%SZ')"
              cp --preserve=mode,timestamps "$backup_path" "$archive_path"
              chmod 600 "$archive_path"
              echo "Preserved server-local backup at $archive_path"
            fi
            git restore --worktree -- "$backup_path"
          done < <(git status --porcelain=v1 -z --untracked-files=no -- infra/backups)

          echo "Rotating server-side administrator credentials from protected Actions secrets..."
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("infra/.env")
          replacements = {
              "ADMIN_API_KEY": os.environ["ROTATED_ADMIN_API_KEY"],
              "INITIAL_ADMIN_PASSWORD": os.environ["ROTATED_INITIAL_ADMIN_PASSWORD"],
          }
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          replaced = set()
          for line in lines:
              key = line.partition("=")[0]
              if key in replacements:
                  updated.append(f"{key}={replacements[key]}")
                  replaced.add(key)
                  continue
              updated.append(line)
          for key, value in replacements.items():
              if key not in replaced:
                  updated.append(f"{key}={value}")
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY

          echo "Step 3 - Pulling latest code..."
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          echo "Step 4 - Rebuilding K3s pods with latest code..."
          bash k8s/scripts/vps-deploy.sh
          REMOTE
