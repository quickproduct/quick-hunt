apiVersion: v1
kind: Namespace
metadata:
  name: job-hunter
  labels:
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: job-hunter
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: job-hunter-quota
  namespace: job-hunter
spec:
  hard:
    # requests.memory capped near node-allocatable (16Gi VPS) so KEDA over-scale
    # lands as Pending (graceful) rather than scheduling onto a full node and
    # OOM-killing core pods. This gives workers room to use the 16Gi VPS while
    # still leaving headroom for k3s/system daemons.
    requests.memory: "13Gi"
    # Allow burst limits above physical memory; requests remain the scheduler
    # guardrail. Chromium-heavy workers stay capped separately by KEDA.
    limits.memory: "64Gi"
    requests.cpu: "9000m"
    limits.cpu: "36000m"
    pods: "120"
