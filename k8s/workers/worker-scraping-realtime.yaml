apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-scraping-realtime
  namespace: job-hunter
  labels:
    app: worker-scraping-realtime
    worker-type: scraping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-scraping-realtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: worker-scraping-realtime
    spec:
      terminationGracePeriodSeconds: 1980
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "waiting for rabbitmq..."; sleep 2; done']
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            # Chromium runs with --disable-dev-shm-usage, so it barely touches
            # /dev/shm; 512Mi bounds the memory-backed tmpfs (counts toward the
            # container limit) and frees headroom for process RSS.
            sizeLimit: 512Mi
      containers:
        - name: worker
          image: k3d-jh-registry:5050/jh-worker-playwright:local
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - services.scraper.celery_app
            - worker
            - --loglevel=warning
            - --pool=threads
            - --concurrency=1
            - -Q
            - jh_scraping_realtime
            - -Ofair
            - -E
            - --without-mingle
            - --without-gossip
            - --hostname=scraping-realtime@%h
          env:
            - name: SERVICE_NAME
              value: "worker-scraping-realtime"
            # Tier 1 render-svc cutover (per-portal via USE_RENDER_SVC flag).
            - name: RENDER_SVC_URL
              value: "http://render-svc.job-hunter.svc.cluster.local"
          envFrom:
            - configMapRef:
                name: job-hunter-config
            - secretRef:
                name: job-hunter-secrets
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              # Tier 1: list scraping now reuses the persistent Chromium
              # singleton (no per-session relaunch spike) and /dev/shm dropped
              # to 512Mi, so the process gets MORE of the limit (768Mi vs the
              # old 512Mi after shm) at a lower ceiling. 1536 → 1280Mi.
              memory: "1280Mi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["bash", "-c", "pgrep -f 'celery.*worker' > /dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scraping-realtime-scaler
  namespace: job-hunter
spec:
  scaleTargetRef:
    name: worker-scraping-realtime
  pollingInterval: 5  # Fast polling — latency-sensitive
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 3
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: jh_scraping_realtime
        mode: QueueLength
        value: "20"
      authenticationRef:
        name: keda-trigger-auth-rabbitmq
